name: release

# Cut a release by pushing a tag:  git tag v0.14.0 && git push origin v0.14.0
# The tag is the single source of truth. This workflow refuses to publish if
# the tag and build.zig.zon disagree, if tests fail, or if any build fails —
# then creates the GitHub release and updates the AUR package in lockstep so
# the released artifact and the packaged source can never drift apart again.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ── Gate: tag == build.zig.zon version, and the tree passes tests ──────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: version consistency (tag == build.zig.zon)
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          zon="$(grep -oP '\.version\s*=\s*"\K[^"]+' build.zig.zon)"
          echo "tag=$tag  build.zig.zon=$zon"
          if [ "$tag" != "$zon" ]; then
            echo "::error::tag v$tag does not match build.zig.zon version $zon — bump build.zig.zon before tagging"
            exit 1
          fi

      - name: setup zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: test
        run: zig build test

  # ── Build per-arch binaries and attach them to the GitHub release ──────────
  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      # Serialize the arch builds: both attach to the same GitHub release, and
      # softprops/action-gh-release CREATES it if missing. Run in parallel and
      # the two jobs race to create it — one wins, the other 422s
      # ("already_exists") and the release ships with only one arch's binary.
      # One at a time: the first creates the release, the second just uploads.
      max-parallel: 1
      matrix:
        target: [x86_64-linux, aarch64-linux]
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: build ${{ matrix.target }}
        run: |
          zig build --release=safe -Dstrip=true -Dtarget=${{ matrix.target }} -Dlto=false
          mv zig-out/bin/zish zig-out/bin/zish-${{ matrix.target }}

      # install.sh refuses to install a binary it cannot verify, so the
      # checksum has to ship alongside it. One file per target; GitHub merges
      # same-named assets across matrix jobs, so each job publishes its own.
      - name: checksum ${{ matrix.target }}
        run: |
          cd zig-out/bin
          sha256sum zish-${{ matrix.target }} > SHA256SUMS-${{ matrix.target }}

      - name: attach to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            zig-out/bin/zish-${{ matrix.target }}
            zig-out/bin/SHA256SUMS-${{ matrix.target }}
          fail_on_unmatched_files: true

  # ── Publish to the AUR from the canonical in-repo PKGBUILD ─────────────────
  aur:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel   # makepkg/updpkgsums need an Arch userland
    steps:
      - name: install tooling
        run: pacman -Sy --noconfirm --needed git openssh pacman-contrib

      - name: checkout (for packaging/PKGBUILD)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Skip AUR publish (don't fail the release) when no deploy key is set —
      # e.g. before a dedicated AUR-only key has been registered. Use a DEDICATED
      # key, never a shared infra/ansible key: a CI compromise would expose it.
      - name: guard on AUR_SSH_KEY
        id: guard
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "::warning::AUR_SSH_KEY not set — skipping AUR publish (GitHub release still done)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: configure ssh (pinned host keys, no TOFU)
        if: steps.guard.outputs.skip == 'false'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # AUR host keys pinned from `ssh-keyscan aur.archlinux.org` (verify before trusting).
          cat > ~/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ssh-rsa 
          EOF
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: build AUR commit and push
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"

          # makepkg/updpkgsums refuse to run as root — use an unprivileged user.
          useradd -m builder
          git config --global --add safe.directory '*'

          git clone ssh://aur@aur.archlinux.org/zish.git /tmp/aur
          cp packaging/PKGBUILD /tmp/aur/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${ver}/" /tmp/aur/PKGBUILD

          chown -R builder:builder /tmp/aur
          # updpkgsums downloads the real GitHub tarball for v$ver and rewrites
          # sha256sums; makepkg --printsrcinfo regenerates .SRCINFO. Both as builder.
          su builder -c 'cd /tmp/aur && updpkgsums && makepkg --printsrcinfo > .SRCINFO'

          cd /tmp/aur
          git config user.name  'Rotko Networks'
          git config user.email 'hq@rotko.net'
          if git diff --quiet && git diff --cached --quiet; then
            echo "AUR already up to date for $ver — nothing to push"
            exit 0
          fi
          git commit -am "release $ver"
          git push origin master
